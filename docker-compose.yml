services:

  postgres:
    image: postgres:16-alpine
    container_name: stylehub-postgres

    environment:
      POSTGRES_DB: stylehub
      POSTGRES_USER: stylehub
      POSTGRES_PASSWORD: stylehub_password

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stylehub -d stylehub"]
      interval: 5s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: stylehub-backend

    env_file:
      - ./backend/.env

    environment:
      DB_NAME: stylehub
      DB_USER: stylehub
      DB_PASSWORD: stylehub_password
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SSLMODE: disable

      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8000:8000"

    command:
      [
        "gunicorn",
        "config.wsgi:application",
        "--bind",
        "0.0.0.0:8000"
      ]


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY}

    container_name: stylehub-frontend

    depends_on:
      - backend

    ports:
      - "5173:80"


volumes:
  postgres_data: